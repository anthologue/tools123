<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool 1 · Robotics Tools</title>
  <script>
    // Apply the saved theme before the page is drawn (light by default).
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-name" href="../../index.html">Robotics Tools</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">Dark theme</button>
    </div>
  </header>

  <main class="container">
    <a class="back-link" href="../../index.html">← All tools</a>
    <h1>Tool 1</h1>
    <p class="intro">Coming soon. This placeholder page checks that opening a tool and getting back to the homepage works.</p>
  </main>

  <script src="../../js/theme.js"></script>
</body>
</html>
